[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wheeled-biped-sim"
version = "0.1.0"
description = "Anchored Conditionally-Gated Control for a 10-DOF wheeled bipedal robot (MuJoCo / MJX)"
readme = "README.md"
# The distributable package is `wheeled_biped*` and `scripts*` — software only,
# which LICENSE-CODE puts under Apache-2.0. The paper materials under `paper/`
# and the raw results under `outputs/` are CC BY-NC-ND 4.0 (LICENSE) and are not
# part of the wheel. See the licence table in README.md.
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Van Thuong Nguyen", email = "nvthuong180702@gmail.com"},
    {name = "Nhu Thanh Vo", email = "vnthanh@dut.udn.vn"},
]

# CPU by default: every ACC evaluation in the paper runs on CPU, and pinning the
# CUDA variant here made `pip install -e .` fail on machines without CUDA.
# For the GPU-only PPO reference of Section 5.4, install the CUDA wheels first:
#   pip install "jax[cuda12]>=0.4.25"
dependencies = [
    "mujoco>=3.1.0",
    "mujoco-mjx>=3.1.0",
    "jax>=0.4.25",
    "jaxlib>=0.4.25",
    "scipy>=1.11",
    "osqp>=0.6",
    "pandas>=2.0",
    "pillow>=10.0",
    "tabulate>=0.9.0",
    "flax>=0.8.0",
    "optax>=0.2.0",
    "chex>=0.1.86",
    "distrax>=0.1.5",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "tensorboardX>=2.6",
    "wandb>=0.16.0",
    "matplotlib>=3.8.0",
    "tqdm>=4.66.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "mediapy>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
wb-train = "scripts.train:app"
wb-eval = "scripts.evaluate:app"
wb-viz = "scripts.visualize:app"

[tool.setuptools.packages.find]
include = ["wheeled_biped*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "slow: marks tests that require JAX/MJX JIT compilation — excluded from fast CI (run with -m slow)",
]
