# ============================================================
# configs/baseline_lqr_torque.yaml
# ============================================================
# Configuration for the FAIR LQR torque baseline.
#
# This baseline operates in DIRECT TORQUE SPACE — the same action space
# as ACC.  Unlike baseline_lqr.yaml (which routes through a PID servo
# layer), this controller outputs joint torques directly, making the
# comparison with ACC scientifically fair.
#
# Key differences from baseline_lqr.yaml:
#   1. low_level_pid.enabled: false  ← direct torque, no PID servo lag
#   2. action_smoothing_alpha: 0.0   ← no smoothing needed for torque
#   3. Uses FairLQRTorqueController   ← coupled 3-D LQR in torque space
#
# Used by: scripts/eval_balance.py --controller baseline_lqr_torque
# ============================================================

# --- Environment ---
task:
  env: BalanceEnv
  initial_min_height: 0.40

# --- Low-level PID DISABLED — direct torque mode ---
# When PID is disabled, _compute_ctrl maps normalised action ∈ [-1, 1]
# linearly to torque via:
#   ctrl = ctrl_min + (action + 1) * 0.5 * (ctrl_max - ctrl_min)
# FairLQRTorqueController outputs actions that reconstruct the desired
# torques under this linear map.
low_level_pid:
  enabled: false
  action_smoothing_alpha: 0.0      # no smoothing for torque output
  anti_windup_limit: 0.4
  wheel_vel_limit: 20.0
  kp: [55.0, 40.0, 70.0, 70.0, 4.0, 55.0, 40.0, 70.0, 70.0, 4.0]
  ki: [0.8,  0.4,  1.0,  1.0,  0.1, 0.8,  0.4,  1.0,  1.0,  0.1]
  kd: [3.0,  2.0,  4.0,  4.0,  0.0, 3.0,  2.0,  4.0,  4.0,  0.0]
  action_delay_steps: 0
  # Torque rate limit [Nm/s] — same as ACC's BalanceCoreTorqueComposer
  max_torque_rate: 400.0

# --- Sensor noise (disabled for nominal eval) ---
sensor_noise:
  enabled: false
  lin_vel_mode: "clean"
  lin_vel_std: 0.0
  ang_vel_std: 0.0
  gravity_std: 0.0
  joint_pos_std: 0.0
  joint_vel_std: 0.0

# --- Termination (matches BalanceEnv defaults) ---
termination:
  max_tilt_rad: 0.8
  min_height: 0.30

# --- Fair LQR Torque controller parameters ---
# Leg joints: direct torque (bypass PID servo). Wheels: cascaded LQR→ω→P→τ
# path. tau_s matches measured PID servo lag (~0.25 s) so LQR gains are
# consistent with the velocity-commanded wheel plant.
baseline_lqr_torque:
  # LQR cost diagonal: [pitch, pitch_rate, fwd_vel, fwd_pos]  (4-state TWIP)
  lqr_q: [10.0, 2.0, 3.0, 0.3]
  lqr_r: 0.8
  tau_s: 0.25

  # Roll balance PD gains
  kp_roll: 55.0
  kd_roll: 5.5
  ki_roll: 8.0

  # Yaw hold PD gains
  kp_yaw: 2.5
  kd_yaw: 0.25
