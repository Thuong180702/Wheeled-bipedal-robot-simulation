# ============================================================
# configs/baseline_full_lqr.yaml
# ============================================================
# Configuration for the FULL-STATE LQR baseline.
#
# This controller derives LQR gains from finite-difference linearization of
# the complete 16-DOF, 10-actuator MuJoCo plant about a solved standing
# equilibrium — NOT a simplified 4- or 6-state analytical model.
#
# MEASURED OUTCOME: the design is numerically sound at every commanded height
# (equilibrium residual 0.43 N of 79.46 N weight, reduced 30-state A full rank
# and PBH-stabilizable, Riccati residual ~1e-14), and with a high control
# weight it stands and tracks height for tens of seconds — but it is not
# stabilizing.  Over a 60 s horizon every configuration falls (22–57 s mean
# time-to-fall) with monotonically growing planar drift, no single r_scale
# holds the whole 0.40–0.70 m band, and max recoverable push is 10–20 N
# against ACC's 83 N.  Report it as a classical baseline that survives ~100x
# longer than the reduced-order ones and still falls.  Do NOT evaluate it at a
# 1000-step (10 s) horizon: that truncates the divergence and reports 0% falls.
# Evidence: outputs/fullstate_lqr_corrected/.  See the full_lqr.py docstring.
#
# Used by: scripts/eval_balance.py --controller baseline_full_lqr
# ============================================================

# --- Environment ---
task:
  env: BalanceEnv
  initial_min_height: 0.40

# --- Action path (DIRECT TORQUE — no PID servo) ---
# The LQR is designed in torque, so it is emitted in torque.  Routing it
# through a position/velocity servo, as an earlier revision did, discards the
# design.  This matches baseline_coupled_lqr_torque, the other direct-torque
# classical baseline.
low_level_pid:
  enabled: false
  action_smoothing_alpha: 0.0
  anti_windup_limit: 0.4
  wheel_vel_limit: 20.0
  kp: [55.0, 40.0, 70.0, 70.0, 4.0, 55.0, 40.0, 70.0, 70.0, 4.0]
  ki: [0.8,  0.4,  1.0,  1.0,  0.1, 0.8,  0.4,  1.0,  1.0,  0.1]
  kd: [3.0,  2.0,  4.0,  4.0,  0.0, 3.0,  2.0,  4.0,  4.0,  0.0]
  action_delay_steps: 0
  max_torque_rate: 400.0            # same ceiling as ACC and the torque baseline

# --- Sensor noise (disabled for nominal eval) ---
sensor_noise:
  enabled: false
  lin_vel_mode: "clean"
  lin_vel_std: 0.0
  ang_vel_std: 0.0
  gravity_std: 0.0
  joint_pos_std: 0.0
  joint_vel_std: 0.0

# --- Termination (matches BalanceEnv defaults) ---
termination:
  max_tilt_rad: 0.8
  min_height: 0.30

# --- Full-State LQR controller parameters ---
# The controller solves a true static equilibrium (x*, u*) at the commanded
# height, finite-differences the whole 50 Hz control step of the full 16-DOF
# MuJoCo plant for the transition Jacobians, drops the two cyclic wheel-angle
# states, and solves the discrete-time Riccati equation.
#
# State (30-dim), all reconstructed from the 42-dim observation:
#    0-1:   base x, y drift (integrated from body linear velocity)
#      2:   base height error
#    3-5:   roll, pitch (from body gravity), yaw error
#   6-13:   eight leg joint angles (wheel angles excluded — cyclic)
#  14-16:   base linear velocity
#  17-19:   base angular velocity
#  20-29:   ten joint velocities
#
# Control (10-dim): actuator torques, emitted directly.
#
# Q and R follow Bryson's rule from physically meaningful maximum deviations,
# so the only free knob is r_scale, which uniformly trades control effort
# against regulation.  It is tuned by sweep — see
# scripts/derive_fullstate_lqr.py — rather than assumed.
baseline_full_lqr:
  r_scale: 1.0
  nominal_height_m: 0.65
