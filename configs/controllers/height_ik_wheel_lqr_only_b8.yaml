# Height IK + Wheel LQR Controller (Phase B.8 Adopted)
#
# ADOPTED: 2026-05-07 based on Phase B.8 ablation study
#
# Architecture: Height IK (Layer 1) + Wheel LQR (Layer 3) only
# Disabled: VMC (Layer 2) + Roll/Yaw (Layer 4)
#
# Performance: 0.425s survival (+166% vs full hierarchical at 0.160s)
#
# Rationale:
# - VMC layer causes instability through aggressive posture corrections
# - Roll/Yaw layer adds noise without improving balance
# - LQR's CoM feedback provides sufficient balance control
# - Simplest effective architecture for height-adaptive standing
#
# Source: ablation_4_ik_lqr_only.yaml from Phase B.8 Task 3

metadata:
  controller_type: height_scheduled_dynamic_lqr_ik
  action_semantics: absolute_normalized
  prior_status: phase_b8_candidate
  validation_date: 2026-05-07

height:
  min: 0.40
  max: 0.70
  grid: [0.70, 0.65, 0.60, 0.55, 0.50, 0.45, 0.40]

# Layer 1: Height IK
ik_hip_pitch_range: [-0.8, 0.2]
ik_knee_range: [0.0, 2.0]
ik_num_samples: 50

# Layer 2: CoM VMC - DISABLED
vmc_enabled: false
vmc_k_com: 150.0
vmc_k_com_dot: 30.0
vmc_max_force: 50.0
vmc_force_to_hip_pitch_gain: 0.02
vmc_force_to_knee_gain: 0.015

# Layer 3: Wheel LQR - ENABLED
height_scheduled_gains_enabled: true
height_scheduled_gains:
  0.40:
    k_pitch: 22.0
    k_pitch_rate: 5.0
    k_fwd_vel: 4.0
    k_fwd_pos: 1.0
    k_com: 15.0
    k_com_rate: 4.5
  0.45:
    k_pitch: 20.0
    k_pitch_rate: 4.5
    k_fwd_vel: 3.5
    k_fwd_pos: 0.9
    k_com: 14.0
    k_com_rate: 4.0
  0.50:
    k_pitch: 18.0
    k_pitch_rate: 4.0
    k_fwd_vel: 3.0
    k_fwd_pos: 0.8
    k_com: 12.0
    k_com_rate: 3.5
  0.55:
    k_pitch: 18.0
    k_pitch_rate: 4.0
    k_fwd_vel: 3.0
    k_fwd_pos: 0.8
    k_com: 12.0
    k_com_rate: 3.5
  0.60:
    k_pitch: 16.0
    k_pitch_rate: 3.5
    k_fwd_vel: 2.5
    k_fwd_pos: 0.7
    k_com: 10.0
    k_com_rate: 3.0
  0.65:
    k_pitch: 15.0
    k_pitch_rate: 3.2
    k_fwd_vel: 2.2
    k_fwd_pos: 0.6
    k_com: 9.0
    k_com_rate: 2.8
  0.70:
    k_pitch: 14.0
    k_pitch_rate: 3.0
    k_fwd_vel: 2.0
    k_fwd_pos: 0.5
    k_com: 8.0
    k_com_rate: 2.5

wheel_cmd_filter_enabled: true
wheel_cmd_filter_alpha: 0.7
wheel_cmd_filter_max_delta: 2.0

# Layer 4: Roll/Yaw - DISABLED
roll:
  kp: 0.0
  kd: 0.0
  max_correction: 0.0

yaw:
  kp: 0.0
  kd: 0.0
  max_diff: 0.0

wheel_vel_limit: 20.0

joint_limits:
  hip_roll: [-0.7, 0.7]
  hip_yaw: [-0.4, 0.4]
  hip_pitch: [-0.5, 1.8]
  knee: [-0.5, 2.7]
  wheel: [-1.0e6, 1.0e6]

com_state:
  mode: "sim_oracle"
  use_sim: true

wheel_cmd_filter:
  enabled: true
  alpha: 0.7
  max_delta_per_step: 2.0

action:
  mode: "absolute_normalized"
  dim: 10

ik:
  method: "fk_scan_polynomial"
  scan_points: 50
  symmetric_fold: true
  polynomial_degree: 2
