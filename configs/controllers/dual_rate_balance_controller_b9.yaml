# ============================================================
# Dual-Rate Time-Scale Separation Controller (Phase B.9 Task 8)
# ============================================================
# Explicit fast/slow loop separation for standalone balance.
#
# Architecture:
#   Fast loop (50Hz): Wheel LQR for immediate balance
#   Slow loop (5Hz): Height IK and posture updates
#   Stability gating: Freeze slow updates when unstable
#
# Goal: Maximize standalone survival time before residual RL.

metadata:
  controller_type: dual_rate_balance_controller_b9
  action_semantics: absolute_normalized
  prior_status: standalone_controller_candidate
  validation_date: 2026-05-08
  uses_time_scale_separation: true
  height_posture_updates_are_gated: true

# --- Time-scale separation ---
time_scale:
  fast_loop_rate_hz: 50  # Wheel balance (every control step)
  slow_loop_rate_hz: 5   # Height/posture updates
  control_dt: 0.02       # 50Hz control frequency

# --- Valid height range ---
height:
  min: 0.40
  max: 0.65  # Do not use 0.70 as normal target
  grid: [0.65, 0.60, 0.55, 0.50, 0.45, 0.40]

# --- Joint limits ---
joint_limits:
  hip_roll: [-0.7, 0.7]
  hip_yaw: [-0.4, 0.4]
  hip_pitch: [-0.5, 1.8]
  knee: [-0.5, 2.7]
  wheel: [-1.0e6, 1.0e6]

wheel_vel_limit: 20.0

# --- Slow loop: Height/posture planner ---
slow_loop:
  # Posture target blending
  posture_blend_alpha: 0.85  # target_new = alpha * target_old + (1-alpha) * target_ik

  # Rate limits (rad per slow-loop update)
  max_hip_pitch_delta: 0.03
  max_knee_delta: 0.03

  # Stability gating
  pitch_gate_deg: 6.0        # Freeze slow updates if |pitch| > this
  pitch_rate_gate_deg_s: 30.0  # Freeze slow updates if |pitch_rate| > this

  # Height correction (weak, rate-limited)
  height_correction_enabled: true
  height_correction_gain: 0.02  # Weak correction
  max_height_correction_per_update: 0.01  # meters

# --- Fast loop: Wheel balance LQR ---
fast_loop:
  # Height-scheduled 6D LQR gains
  height_scheduled_gains_enabled: true
  height_scheduled_gains:
    0.65:
      k_pitch: 16.0
      k_pitch_rate: 3.2
      k_fwd_vel: 2.2
      k_fwd_pos: 0.6
      k_com: 9.0
      k_com_rate: 2.8
    0.60:
      k_pitch: 17.0
      k_pitch_rate: 3.5
      k_fwd_vel: 2.5
      k_fwd_pos: 0.7
      k_com: 10.0
      k_com_rate: 3.0
    0.55:
      k_pitch: 18.0
      k_pitch_rate: 4.0
      k_fwd_vel: 3.0
      k_fwd_pos: 0.8
      k_com: 12.0
      k_com_rate: 3.5
    0.50:
      k_pitch: 20.0
      k_pitch_rate: 4.5
      k_fwd_vel: 3.5
      k_fwd_pos: 1.0
      k_com: 14.0
      k_com_rate: 4.0
    0.45:
      k_pitch: 22.0
      k_pitch_rate: 5.0
      k_fwd_vel: 4.0
      k_fwd_pos: 1.2
      k_com: 16.0
      k_com_rate: 4.5
    0.40:
      k_pitch: 25.0
      k_pitch_rate: 5.5
      k_fwd_vel: 4.5
      k_fwd_pos: 1.5
      k_com: 18.0
      k_com_rate: 5.0

  # Wheel command filtering
  wheel_cmd_filter_enabled: true
  wheel_cmd_filter_alpha: 0.5
  wheel_cmd_filter_max_delta: 2.0

  # Emergency mode (when pitch is large)
  emergency_mode_enabled: true
  emergency_pitch_threshold_deg: 10.0
  emergency_lqr_gain_multiplier: 1.25

# --- Roll/yaw stabilization (disabled initially) ---
roll:
  kp: 0.0
  kd: 0.0
  max_correction: 0.0

yaw:
  kp: 0.0
  kd: 0.0
  max_diff: 0.0

# --- Minimal lateral balance layer (Step 5.14; disabled by default) ---
lateral_balance:
  enabled: false
  k_roll: 0.0
  k_roll_rate: 0.0
  k_com_y: 0.0
  k_com_y_rate: 0.0
  k_force_diff: 0.0
  max_correction: 0.0
  sign: 1.0
  roll_target: 0.0
  com_y_target: 0.0

# --- Minimal VMC / whole-body force distribution layer (Step 5.15; disabled by default) ---
vmc_whole_body:
  enabled: false
  mapping: "combined_weak"
  k_roll: 0.0
  k_roll_rate: 0.0
  k_com_y: 0.0
  k_com_y_rate: 0.0
  k_force_diff: 0.0
  a_roll: 0.0
  a_com: 0.0
  a_force: 0.0
  max_delta_support: 0.0
  max_hip_roll_correction: 0.0
  max_leg_length_correction: 0.0
  sign: 1.0
  roll_target: 0.0
  com_y_target: 0.0
  external_force_diff_error: 0.0

# --- Jacobian-informed WBC/VMC target-offset layer (Step 5.16; disabled by default) ---
wbc_vmc:
  enabled: false
  mode: "jacobian_combined"
  update_rate_hz: 50
  use_mujoco_jacobian: true
  use_finite_difference_fallback: true
  compose_with_lateral_balance: false
  compose_with_vmc_whole_body: false

  gains:
    k_roll: 0.0
    k_roll_rate: 0.0
    k_com_y: 0.0
    k_com_y_rate: 0.0
    k_height: 0.0
    k_height_rate: 0.0
    k_force_balance: 0.0

  limits:
    max_delta_fz: 0.0
    max_hip_roll_offset: 0.0
    max_hip_pitch_offset: 0.0
    max_knee_offset: 0.0
    max_wheel_diff_cmd: 0.0
    max_correction_rate: 0.0

  mappings:
    use_hip_roll: true
    use_hip_pitch: true
    use_knee: true
    use_wheel_diff: false

  safety:
    disable_on_wheel_unload: true
    disable_on_large_pitch: true
    large_pitch_deg: 8.0
    disable_on_large_contact_impulse: true
    large_contact_impulse_n: 2000.0

# --- Diagnostic torque/generalized-force WBC prototype (Step 5.17; disabled by default) ---
torque_wbc:
  enabled: false
  diagnostic_only: true
  mode: "qfrc_applied"
  gains:
    k_roll: 0.0
    k_roll_rate: 0.0
    k_com_y: 0.0
    k_com_y_rate: 0.0
    k_height: 0.0
    k_height_rate: 0.0
  limits:
    max_joint_torque: 0.0
    max_wheel_torque: 0.0
    max_body_wrench: 0.0
    max_torque_rate: 0.0
  safety:
    disable_on_contact_loss: true
    disable_on_large_pitch: true
    large_pitch_deg: 8.0
    disable_on_large_roll: true
    large_roll_deg: 8.0

# --- CoM state ---
com_state:
  mode: "sim_oracle"
  use_sim: true

# --- Action semantics ---
action:
  mode: "absolute_normalized"
  dim: 10

# --- Height IK ---
ik:
  method: "fk_scan_polynomial"
  scan_points: 25
  symmetric_fold: true
  polynomial_degree: 2

# --- Tuning notes ---
# Initial conservative parameters.
# Tuning script will sweep:
# - slow_loop_rate_hz: [2, 5, 10]
# - posture_blend_alpha: [0.7, 0.85, 0.95]
# - max_hip_pitch_delta: [0.01, 0.03, 0.05]
# - max_knee_delta: [0.01, 0.03, 0.05]
# - pitch_gate_deg: [4, 6, 8, 10]
# - wheel_lqr_gain_multiplier: [0.75, 1.0, 1.25, 1.5]
# - com_gain_multiplier: [0.75, 1.0, 1.25, 1.5]
# - wheel_filter_alpha: [0.3, 0.5, 0.7]
# - max_wheel_delta: [1.0, 2.0, 3.0, 5.0]
