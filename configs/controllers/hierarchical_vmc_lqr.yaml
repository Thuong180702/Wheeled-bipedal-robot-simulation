# ============================================================
# Hierarchical VMC+LQR Controller Config (Phase B.7)
# ============================================================
# 4-layer hierarchical control:
#   Layer 1: Height IK (geometric height tracking)
#   Layer 2: CoM VMC (virtual force for CoM correction)
#   Layer 3: Wheel LQR (sagittal balance with height-scheduled gains)
#   Layer 4: Roll/Yaw stabilization

metadata:
  controller_type: height_scheduled_dynamic_lqr_ik
  action_semantics: absolute_normalized
  prior_status: phase_b7_reference_rejected
  validation_date: 2026-05-07

height:
  min: 0.40
  max: 0.70
  grid: [0.70, 0.65, 0.60, 0.55, 0.50, 0.45, 0.40]

# Layer 1: Height IK
ik_hip_pitch_range: [-0.8, 0.2]
ik_knee_range: [0.0, 2.0]
ik_num_samples: 50

# Layer 2: CoM Virtual Model Control
vmc_enabled: true
vmc_k_com: 150.0  # Virtual spring stiffness [N/m]
vmc_k_com_dot: 30.0  # Virtual damping [N·s/m]
vmc_max_force: 50.0  # Maximum virtual force [N]
vmc_force_to_hip_pitch_gain: 0.02  # Force → hip pitch mapping [rad/N]
vmc_force_to_knee_gain: 0.015  # Force → knee mapping [rad/N]

# Layer 3: Wheel LQR (height-scheduled gains from B.6)
height_scheduled_gains_enabled: true
height_scheduled_gains:
  0.40:
    k_pitch: 22.0
    k_pitch_rate: 5.0
    k_fwd_vel: 4.0
    k_fwd_pos: 1.0
    k_com: 15.0
    k_com_rate: 4.5
  0.45:
    k_pitch: 20.0
    k_pitch_rate: 4.5
    k_fwd_vel: 3.5
    k_fwd_pos: 0.9
    k_com: 14.0
    k_com_rate: 4.0
  0.50:
    k_pitch: 18.0
    k_pitch_rate: 4.0
    k_fwd_vel: 3.0
    k_fwd_pos: 0.8
    k_com: 12.0
    k_com_rate: 3.5
  0.55:
    k_pitch: 18.0
    k_pitch_rate: 4.0
    k_fwd_vel: 3.0
    k_fwd_pos: 0.8
    k_com: 12.0
    k_com_rate: 3.5
  0.60:
    k_pitch: 16.0
    k_pitch_rate: 3.5
    k_fwd_vel: 2.5
    k_fwd_pos: 0.7
    k_com: 10.0
    k_com_rate: 3.0
  0.65:
    k_pitch: 15.0
    k_pitch_rate: 3.2
    k_fwd_vel: 2.2
    k_fwd_pos: 0.6
    k_com: 9.0
    k_com_rate: 2.8
  0.70:
    k_pitch: 14.0
    k_pitch_rate: 3.0
    k_fwd_vel: 2.0
    k_fwd_pos: 0.5
    k_com: 8.0
    k_com_rate: 2.5

# Wheel command filtering
wheel_cmd_filter_enabled: true
wheel_cmd_filter_alpha: 0.7
wheel_cmd_filter_max_delta: 2.0

# Layer 4: Roll stabilization
roll:
  kp: 2.0
  kd: 0.4
  max_correction: 0.4

# Layer 4: Yaw stabilization
yaw:
  kp: 3.0
  kd: 0.3
  max_diff: 2.5

# Action limits
wheel_vel_limit: 20.0

joint_limits:
  hip_roll: [-0.7, 0.7]
  hip_yaw: [-0.4, 0.4]
  hip_pitch: [-0.5, 1.8]
  knee: [-0.5, 2.7]
  wheel: [-1.0e6, 1.0e6]

# CoM computation
com_state:
  mode: "sim_oracle"
  use_sim: true

wheel_cmd_filter:
  enabled: true
  alpha: 0.7
  max_delta_per_step: 2.0

action:
  mode: "absolute_normalized"
  dim: 10

ik:
  method: "fk_scan_polynomial"
  scan_points: 50
  symmetric_fold: true
  polynomial_degree: 2
