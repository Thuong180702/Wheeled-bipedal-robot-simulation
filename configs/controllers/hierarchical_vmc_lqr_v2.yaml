# Hierarchical VMC+LQR Controller v2
# Fix: Remove CoM double-counting by eliminating CoM terms from LQR
# VMC handles posture via leg joints, LQR handles balance via wheels only

height_min: 0.40
height_max: 0.70

# Layer 1: Height IK (unchanged)
ik_hip_pitch_range: [-0.8, 0.2]
ik_knee_range: [0.0, 2.0]
ik_num_samples: 50

# Layer 2: CoM VMC - ENABLED for posture control
vmc_enabled: true
vmc_k_com: 150.0
vmc_k_com_dot: 30.0
vmc_max_force: 50.0
vmc_force_to_hip_pitch_gain: 0.02
vmc_force_to_knee_gain: 0.015

# Layer 3: Wheel LQR - CoM terms REMOVED (k_com=0, k_com_rate=0)
# LQR now only responds to pitch, pitch_rate, fwd_vel, fwd_pos
lqr_height_scheduled: true
lqr_gains:
  0.40:
    k_pitch: 22.0
    k_pitch_rate: 5.0
    k_fwd_vel: 4.0
    k_fwd_pos: 1.0
    k_com: 0.0          # REMOVED: was 15.0
    k_com_rate: 0.0     # REMOVED: was 4.5
  0.45:
    k_pitch: 20.0
    k_pitch_rate: 4.5
    k_fwd_vel: 3.5
    k_fwd_pos: 0.9
    k_com: 0.0          # REMOVED: was 14.0
    k_com_rate: 0.0     # REMOVED: was 4.0
  0.50:
    k_pitch: 18.0
    k_pitch_rate: 4.0
    k_fwd_vel: 3.0
    k_fwd_pos: 0.8
    k_com: 0.0          # REMOVED: was 12.0
    k_com_rate: 0.0     # REMOVED: was 3.5
  0.55:
    k_pitch: 18.0
    k_pitch_rate: 4.0
    k_fwd_vel: 3.0
    k_fwd_pos: 0.8
    k_com: 0.0          # REMOVED: was 12.0
    k_com_rate: 0.0     # REMOVED: was 3.5
  0.60:
    k_pitch: 16.0
    k_pitch_rate: 3.5
    k_fwd_vel: 2.5
    k_fwd_pos: 0.7
    k_com: 0.0          # REMOVED: was 10.0
    k_com_rate: 0.0     # REMOVED: was 3.0
  0.65:
    k_pitch: 15.0
    k_pitch_rate: 3.2
    k_fwd_vel: 2.2
    k_fwd_pos: 0.6
    k_com: 0.0          # REMOVED: was 9.0
    k_com_rate: 0.0     # REMOVED: was 2.8
  0.70:
    k_pitch: 14.0
    k_pitch_rate: 3.0
    k_fwd_vel: 2.0
    k_fwd_pos: 0.5
    k_com: 0.0          # REMOVED: was 8.0
    k_com_rate: 0.0     # REMOVED: was 2.5

wheel_cmd_filter_enabled: true
wheel_cmd_filter_alpha: 0.7
wheel_cmd_filter_max_delta: 2.0

# Layer 4: Roll/Yaw stabilization (unchanged)
roll_kp: 2.0
roll_kd: 0.4
roll_max_correction: 0.4
yaw_kp: 3.0
yaw_kd: 0.3
yaw_max_diff: 2.5

wheel_vel_limit: 20.0
com_use_sim: true
