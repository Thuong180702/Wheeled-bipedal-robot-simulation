# Ablation 3: No Roll/Yaw (Layer 4 disabled)
# Tests if lateral/heading stabilization causes instability

height_min: 0.40
height_max: 0.70

# Layer 1: Height IK
ik_hip_pitch_range: [-0.8, 0.2]
ik_knee_range: [0.0, 2.0]
ik_num_samples: 50

# Layer 2: CoM VMC - ENABLED
vmc_enabled: true
vmc_k_com: 150.0
vmc_k_com_dot: 30.0
vmc_max_force: 50.0
vmc_force_to_hip_pitch_gain: 0.02
vmc_force_to_knee_gain: 0.015

