    k_com: 15.0
    k_com_rate: 4.5
  0.45:
    k_pitch: 20.0
    k_pitch_rate: 4.5
    k_fwd_vel: 3.5
    k_fwd_pos: 0.9
    k_com: 14.0
    k_com_rate: 4.0
  0.50:
    k_pitch: 18.0
    k_pitch_rate: 4.0
    k_fwd_vel: 3.0
    k_fwd_pos: 0.8
    k_com: 12.0
    k_com_rate: 3.5
  0.55:
    k_pitch: 18.0
    k_pitch_rate: 4.0
    k_fwd_vel: 3.0
    k_fwd_pos: 0.8
    k_com: 12.0
    k_com_rate: 3.5
  0.60:
