# ============================================================
# configs/controllers/height_scheduled_dynamic_lqr.yaml
# ============================================================
# Configuration for height-scheduled dynamic LQR/IK prior with
# CoM feedback (Phase B.6 stronger classical prior candidate).
#
# This prior extends geometric_lqr_ik with:
# - 6D state: [pitch_error, pitch_rate, fwd_vel, fwd_pos, com_y_error, com_y_error_rate]
# - Height-scheduled gains: K = K(height_cmd)
# - CoM feedback integrated into LQR (not additive correction)
# - Optional wheel command filtering
#
# Goal: Build the strongest practical classical prior before
# residual PPO training. Must beat geometric_lqr_ik by 20%
# to justify use as main residual training prior.
# ============================================================

# --- Controller Metadata ---
metadata:
  controller_type: height_scheduled_dynamic_lqr_ik
  action_semantics: absolute_normalized
  prior_status: stronger_classical_prior_candidate
  sign_conventions_verified: true
  validation_date: 2026-05-07
  forward_axis: +Y
  uses_sim_com: true  # Uses simulator CoM oracle (MuJoCo subtree_com)
  hardware_deployable_without_com_estimator: false  # Requires CoM estimator for hardware
  known_limitations:
    - Uses simulator CoM oracle (subtree_com) - requires CoM estimator for hardware deployment
    - Height-scheduled gains require tuning per height
    - Wheel command filtering adds delay (trade smoothness vs responsiveness)
    - Still a limited prior - residual PPO expected to learn dynamic balance corrections
  phase_b6_goals:
    - Beat geometric_lqr_ik survival time by 20% OR
    - Beat geometric_lqr_ik pitch RMS by 20% OR
    - Beat geometric_lqr_ik fall rate by 10 percentage points
    - No severe action saturation or oscillation
    - No simulator-only dependencies that conflict with paper claims

# ============================================================

# --- Height range and grid ---
height:
  min: 0.40  # meters
  max: 0.70  # meters
  # Height grid for gain scheduling (interpolation between these points)
  grid: [0.70, 0.65, 0.60, 0.55, 0.50, 0.45, 0.40]

# --- Joint limits (from wheeled_biped_real.xml) ---
joint_limits:
  hip_roll: [-0.7, 0.7]    # rad
  hip_yaw: [-0.4, 0.4]     # rad
  hip_pitch: [-0.5, 1.8]   # rad
  knee: [-0.5, 2.7]        # rad
  wheel: [-1.0e6, 1.0e6]   # unlimited (velocity target)

# --- Wheel velocity limit ---
wheel_vel_limit: 20.0  # rad/s (must match low_level_pid config)

# --- Height-scheduled gains (Phase B.6) ---
# Enable height-scheduled 6D LQR with CoM feedback
height_scheduled_gains_enabled: true

# Gain schedule: K(h) for each height in grid
# 6D state: [pitch_error, pitch_rate, fwd_vel, fwd_pos, com_y_error, com_y_error_rate]
# Gains are linearly interpolated at runtime
height_scheduled_gains:
  0.70:  # Tallest stance
    k_pitch: 15.0
    k_pitch_rate: 3.0
    k_fwd_vel: 2.0
    k_fwd_pos: 0.5
    k_com: 8.0
    k_com_rate: 2.5
  0.65:
    k_pitch: 16.0
    k_pitch_rate: 3.2
    k_fwd_vel: 2.2
    k_fwd_pos: 0.6
    k_com: 9.0
    k_com_rate: 2.8
  0.60:
    k_pitch: 17.0
    k_pitch_rate: 3.5
    k_fwd_vel: 2.5
    k_fwd_pos: 0.7
    k_com: 10.0
    k_com_rate: 3.0
  0.55:  # Nominal stance
    k_pitch: 18.0
    k_pitch_rate: 4.0
    k_fwd_vel: 3.0
    k_fwd_pos: 0.8
    k_com: 12.0
    k_com_rate: 3.5
  0.50:
    k_pitch: 20.0
    k_pitch_rate: 4.5
    k_fwd_vel: 3.5
    k_fwd_pos: 1.0
    k_com: 14.0
    k_com_rate: 4.0
  0.45:
    k_pitch: 22.0
    k_pitch_rate: 5.0
    k_fwd_vel: 4.0
    k_fwd_pos: 1.2
    k_com: 16.0
    k_com_rate: 4.5
  0.40:  # Lowest stance (most unstable)
    k_pitch: 25.0
    k_pitch_rate: 5.5
    k_fwd_vel: 4.5
    k_fwd_pos: 1.5
    k_com: 18.0
    k_com_rate: 5.0

# --- CoM state configuration ---
com_state:
  mode: "sim_oracle"  # Use simulator CoM (MuJoCo subtree_com)
  # Future modes: "estimated" (kinematic CoM from body masses)
  use_sim: true  # Legacy flag for compatibility

# --- Wheel command filtering ---
wheel_cmd_filter:
  enabled: true
  alpha: 0.7  # Exponential smoothing: cmd_filtered = alpha * cmd_prev + (1-alpha) * cmd_raw
  max_delta_per_step: 2.0  # Max change in wheel velocity command per step [rad/s]

# --- Command limits ---
command_limits:
  max_wheel_vel_cmd: 20.0  # rad/s
  max_com_correction: 5.0  # rad/s (not used in 6D LQR, kept for compatibility)

# --- Roll stabilization (lateral balance via hip_roll) ---
roll:
  kp: 1.5   # proportional gain (normalized hip_roll per unit g_body[0])
  kd: 0.3   # derivative gain (normalized hip_roll per unit ang_vel[1])
  max_correction: 0.3  # max roll correction before normalization [rad]

# --- Yaw hold (differential wheel correction) ---
yaw:
  kp: 2.5  # proportional gain (rad/s per rad of yaw error)
  kd: 0.2  # derivative gain (rad/s per rad/s of yaw rate)
  max_diff: 2.0  # max differential wheel velocity [rad/s]

# --- DEPRECATED Phase B.5 variants (disabled by default) ---
# These failed in Phase B.5 evaluation and should not be used
pitch_bias_enabled: false
pitch_bias_table: {}
pitch_bias_max_abs_deg: 0.0

com_feedback_enabled: false  # Additive CoM feedback (deprecated, use height_scheduled_gains instead)
com_k_com: 0.0
com_k_com_dot: 0.0
com_max_correction: 0.0

# --- Action semantics ---
action:
  mode: "absolute_normalized"  # output is base_action_abs ∈ [-1, 1]^10
  dim: 10

# --- Height IK ---
ik:
  method: "fk_scan_polynomial"
  scan_points: 25
  symmetric_fold: true
  polynomial_degree: 2

# --- Tuning notes ---
# Initial gains are conservative estimates. Tuning script will sweep:
# - pitch gain: [10, 15, 20, 25, 30]
# - pitch_rate gain: [2, 3, 4, 5, 6]
# - fwd_vel gain: [1, 2, 3, 4, 5]
# - com gain: [5, 8, 10, 12, 15, 18]
# - com_rate gain: [1.5, 2.0, 2.5, 3.0, 4.0, 5.0]
# - wheel filter alpha: [0.5, 0.6, 0.7, 0.8]
#
# Evaluation will compare against geometric_lqr_ik baseline.
# Decision rule: use as main residual prior only if clearly better.
