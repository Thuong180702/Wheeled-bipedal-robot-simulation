metadata:
  controller_type: height_scheduled_dynamic_lqr_ik
  action_semantics: absolute_normalized
  prior_status: stronger_classical_prior_candidate
  sign_conventions_verified: true
  validation_date: 2026-05-07
  forward_axis: +Y
  uses_sim_com: true
  hardware_deployable_without_com_estimator: false
  known_limitations:
  - Uses simulator CoM oracle (subtree_com) - requires CoM estimator for hardware
    deployment
  - Height-scheduled gains require tuning per height
  - Wheel command filtering adds delay (trade smoothness vs responsiveness)
  - Still a limited prior - residual PPO expected to learn dynamic balance corrections
  phase_b6_goals:
  - Beat geometric_lqr_ik survival time by 20% OR
  - Beat geometric_lqr_ik pitch RMS by 20% OR
  - Beat geometric_lqr_ik fall rate by 10 percentage points
  - No severe action saturation or oscillation
  - No simulator-only dependencies that conflict with paper claims
height:
  min: 0.4
  max: 0.7
  grid:
  - 0.7
  - 0.65
  - 0.6
  - 0.55
  - 0.5
  - 0.45
  - 0.4
joint_limits:
  hip_roll:
  - -0.7
  - 0.7
  hip_yaw:
  - -0.4
  - 0.4
  hip_pitch:
  - -0.5
  - 1.8
  knee:
  - -0.5
  - 2.7
  wheel:
  - -1.0e6
  - 1.0e6
wheel_vel_limit: 20.0
height_scheduled_gains_enabled: true
